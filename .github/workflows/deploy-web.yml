name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Avoid loops when this workflow commits the exported web build into docs/
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Download Godot 4.3 headless editor
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/bin"
          if [ ! -x "$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ]; then
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o /tmp/godot.zip -d "$HOME/godot"
          fi
          ln -sfn "$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/godot" --version

      - name: Download export templates
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ]; then
            curl -fsSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p /tmp/godot-templates
            unzip -o /tmp/templates.tpz -d /tmp/godot-templates
            cp -f /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          fi
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
          cat "$TEMPLATE_DIR/version.txt"

      - name: Export Web (no threads)
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          # Confirm nothreads build (GitHub Pages has no COOP/COEP headers)
          grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          ls -lh build/web

      # Primary publish path: this repo's Pages source is currently
      # "Deploy from a branch" → main → /docs (legacy). We cannot switch it to
      # "GitHub Actions" via the API (403), so ship the build into docs/.
      - name: Publish export into docs/ for branch Pages
        run: |
          set -euo pipefail
          mkdir -p docs
          # Replace only top-level docs web files; keep docs/screenshots/
          find docs -maxdepth 1 -type f -delete
          cp -a build/web/. docs/
          test -f docs/index.html
          test -f docs/.nojekyll

      - name: Commit docs web build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No docs/ changes to commit"
            exit 0
          fi
          git commit -m "docs: refresh GitHub Pages web build"
          git push origin HEAD:main

      # Also upload a Pages artifact. This succeeds for deploy-pages only when
      # Settings → Pages → Source is "GitHub Actions". Kept best-effort.
      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    # Only meaningful when Pages source is GitHub Actions.
    # Branch-/docs publishing above already covers the current legacy setting.
    if: ${{ success() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
